<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>霞与昼</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="霞与昼">
<meta name="application-name" content="霞与昼">
<meta name="theme-color" content="#292929">
<style>
  :root{
    --bg:   #292929;                     /* 默认深灰底 */
    --font: "PingFang SC","Microsoft YaHei","Hiragino Sans GB",
            system-ui,-apple-system,"Segoe UI",sans-serif;

    --ink:     #f2f2f2;
    --ink-dim: rgba(255,255,255,.38);
    --edge:    rgba(255,255,255,.14);
    --slot:    #0b0b0b;                  /* 黑色输入框 */

    /* 文字颜色：可在右下角封面设置里改 */
    --title-color: #f6f6f6;              /* 霞与昼 */
    --enter-color: #000000;              /* 进入小世界 */

    /* 封面字体：inherit = 跟随「整体字体」 */
    --title-font: inherit;
    --enter-font: inherit;

    /* 胶囊磨砂：RGB 三元组 + 透明度倍率，由右下角封面设置控制 */
    --pod-tint: 255 255 255;
    --pod-alpha: 1;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{ height:100%; }

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* ---------- 背景层（胶囊磨砂取样的对象） ---------- */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    background-color:var(--bg);
    /* 默认柔光：让磨砂有东西可磨 */
    background-image:
      radial-gradient(circle at 12% 6%,  rgba(255,255,255,.11), rgba(255,255,255,0) 42%),
      radial-gradient(circle at 88% 94%, rgba(255,255,255,.075), rgba(255,255,255,0) 42%);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  /* 自定义图片时压一层浅暗调，保证白字可读 */
  .bg::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0);
    transition:background .6s ease;
  }
  .bg.has-image::after{ background:rgba(0,0,0,.22); }

  /* ---------- 磨砂胶囊：圈内半磨砂，圈外清晰 ---------- */
  .pod{
    position:relative;
    z-index:1;
    width:min(300px,80vw);
    height:min(560px,72vh);
    height:min(560px,72dvh);
    padding:38px 26px 74px;   /* 底部留出圆弧空间 */
    border-radius:999px;
    display:flex;
    flex-direction:column;
    align-items:center;

    /* 磨砂色与透明度由 --pod-tint / --pod-alpha 驱动（右下角封面设置可调） */
    background:linear-gradient(180deg,
                rgb(var(--pod-tint) / var(--pod-a1, .10)),
                rgb(var(--pod-tint) / var(--pod-a2, .045)) 46%,
                rgb(var(--pod-tint) / var(--pod-a3, .085)));
    border:1px solid rgb(255 255 255 / var(--pod-ring, .14));
    /* 模糊/饱和度/描边/内高光全部随透明度走：
       调到 0 时胶囊成为纯窗口，内部与背景完全一致 */
    backdrop-filter:blur(var(--pod-blur, 14px)) saturate(var(--pod-sat, 1.12));
    -webkit-backdrop-filter:blur(var(--pod-blur, 14px)) saturate(var(--pod-sat, 1.12));
    box-shadow:0 30px 70px rgba(0,0,0,.50),
               inset 0 1px 0 rgb(255 255 255 / var(--pod-hl, .20)),
               inset 0 -1px 0 rgb(255 255 255 / var(--pod-hl2, .06));

    cursor:pointer;
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
    transition:box-shadow .5s ease;
  }

  .pod.ready{
    box-shadow:0 34px 80px rgba(0,0,0,.55),
               inset 0 1px 0 rgb(255 255 255 / var(--pod-hlr, .28)),
               inset 0 -1px 0 rgb(255 255 255 / var(--pod-hlr2, .08));
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(14px) scale(.98); }
    to  { opacity:1; transform:translateY(0)    scale(1);   }
  }

  /* ---------- 顶部圆环：霞与昼 ---------- */
  .lens{
    width:min(148px,52vw);
    height:min(148px,52vw);
    flex:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(255,255,255,.22);
    background:radial-gradient(circle at 50% 32%,
                rgba(255,255,255,.10), rgba(255,255,255,.015) 72%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.26),
               0 10px 26px rgba(0,0,0,.26);
    transition:border-color .55s ease, box-shadow .55s ease;
  }
  .pod.ready .lens{
    border-color:rgba(255,255,255,.44);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.40),
               0 0 34px rgba(255,255,255,.10),
               0 10px 26px rgba(0,0,0,.28);
  }

  .title{
    margin:0;
    font-family:var(--title-font);
    font-size:clamp(18px,5vw,21px);
    font-weight:400;
    letter-spacing:.22em;
    text-indent:.22em;
    color:var(--title-color);
    text-shadow:0 1px 12px rgba(0,0,0,.28);
  }

  /* ---------- 中段：小世界 ---------- */
  .mid{
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .enter{
    /* 与圆环同款描边，但做成和密码框一样的长条胶囊，宽度贴合文字 */
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:46px;                            /* 与密码框同高 */
    padding:0 20px 0 calc(20px + .34em);    /* 左内边距补掉字距的尾部空隙，视觉居中 */
    border-radius:999px;
    border:1px solid rgba(255,255,255,.22);
    background:radial-gradient(circle at 50% 30%,
                rgba(255,255,255,.10), rgba(255,255,255,.015) 72%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.26),
               0 10px 26px rgba(0,0,0,.26);

    font-family:var(--enter-font);
    font-size:clamp(15px,4.2vw,16px);
    letter-spacing:.34em;
    color:var(--enter-color);
    user-select:none;

    transition:color .5s ease, border-color .55s ease, box-shadow .55s ease;
  }
  .pod.ready .enter{
    /* 不再改文字颜色，只提亮描边和辉光，颜色交给 --enter-color */
    border-color:rgba(255,255,255,.44);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.40),
               0 0 34px rgba(255,255,255,.10),
               0 10px 26px rgba(0,0,0,.28);
    cursor:pointer;
  }
  /* 进入按钮 + 下方小字，整组位置与淡入 */
  .enter-box{
    position:relative;
    top:10%;
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    transform:translateY(8px) scale(.97);
    pointer-events:none;
    transition:opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .pod.ready .enter-box{ opacity:1; transform:none; pointer-events:auto; }

  .pod.ready .enter:hover { transform:translateY(-1px); }
  .pod.ready .enter:active{ transform:translateY(0); }

  /* ---------- 密码区（验证通过即收起并跳转） ---------- */
  .form{
    width:100%;
    flex:none;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    max-height:150px;
    opacity:1;
    transition:max-height .55s cubic-bezier(.2,.8,.2,1),
               opacity    .40s ease;
  }
  .pod.ready .form{
    max-height:0;
    opacity:0;
    pointer-events:none;
  }
  /* 解锁后：提示文字收起，中段铺满整卡，「进入小世界」相对卡片真正居中 */
  /* 解锁后：底部提示改为「正在链接中」，并用 margin-top:auto 压到卡片底部 */
  .pod.ready .hint{ display:block; margin-top:auto; }
  .pod.ready .mid{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .pod.ready .mid .enter{ pointer-events:auto; }

  .slot{
    width:100%;
    height:46px;
    border:0;
    border-radius:999px;
    background:var(--slot);
    color:#f2f2f2;
    font-family:inherit;
    font-size:15px;
    letter-spacing:.45em;
    text-indent:.45em;
    text-align:center;
    outline:none;
    -webkit-appearance:none;
    appearance:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.09);
    transition:box-shadow .35s ease;
    cursor:text;
  }
  .slot::placeholder{
    color:rgba(255,255,255,.30);
    font-size:13px;
    letter-spacing:.16em;
    text-indent:.16em;
  }
  .slot:focus{
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),
               inset 0 0 0 1px rgba(255,255,255,.22);
  }

  /* 确认按钮 */
  .confirm{
    min-width:106px;
    height:34px;
    padding:0 22px;
    border:1px solid rgba(255,255,255,.22);
    border-radius:999px;
    background:rgba(255,255,255,.05);
    color:rgba(255,255,255,.90);
    font-family:inherit;
    font-size:13px;
    letter-spacing:.24em;
    text-indent:.24em;
    cursor:pointer;
    transition:background .3s ease, border-color .3s ease, transform .2s ease;
  }
  .confirm:hover { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.36); }
  .confirm:active{ transform:scale(.975); }

  /* ---------- 提示 ---------- */
  .hint{
    width:100%;
    margin:14px 0 0;
    flex:none;
    text-align:center;
    font-size:11px;
    letter-spacing:.2em;
    text-indent:.2em;
    color:var(--ink-dim);
    transition:color .4s ease;
  }
  .hint.warn{ color:rgba(255,255,255,.75); }

  /* ---------- 重设记忆（仅免密时出现） ---------- */
  .reset{
    position:fixed;
    left:50%;
    bottom:max(16px, env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:2;
    padding:8px 14px;
    border:0;
    background:none;
    color:rgba(255,255,255,.30);
    font-family:inherit;
    font-size:11px;
    letter-spacing:.2em;
    cursor:pointer;
    transition:color .3s ease;
  }
  .reset:hover{ color:rgba(255,255,255,.62); }
  .reset[hidden]{ display:none; }

  /* ---------- 右下角：封面设置入口（刻意不起眼） ---------- */
  .dot{
    position:fixed;
    right:max(10px, env(safe-area-inset-right));
    bottom:max(10px, env(safe-area-inset-bottom));
    z-index:22;
    width:36px;
    height:36px;
    padding:0;
    border:0;
    background:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .dot i{
    display:block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:rgba(255,255,255,.20);
    transition:background .35s ease, transform .35s ease, box-shadow .35s ease;
  }
  .dot:hover i,
  .dot:focus-visible i{
    background:rgba(255,255,255,.62);
    transform:scale(1.25);
    box-shadow:0 0 12px rgba(255,255,255,.30);
  }

  /* ---------- 设置面板 ---------- */
  .sheet{
    position:fixed;
    right:max(10px, env(safe-area-inset-right));
    bottom:calc(max(10px, env(safe-area-inset-bottom)) + 42px);
    z-index:21;
    width:min(272px, calc(100vw - 24px));
    padding:16px 16px 12px;
    border-radius:18px;
    background:rgba(30,30,30,.74);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(18px) saturate(1.1);
    -webkit-backdrop-filter:blur(18px) saturate(1.1);
    box-shadow:0 20px 50px rgba(0,0,0,.50);
    animation:pop .28s cubic-bezier(.2,.8,.2,1) both;
  }
  .sheet[hidden]{ display:none; }

  @keyframes pop{
    from{ opacity:0; transform:translateY(8px) scale(.97); }
    to  { opacity:1; transform:none; }
  }

  .sheet-title{
    margin:0 0 14px;
    font-size:11px;
    letter-spacing:.24em;
    text-indent:.24em;
    color:rgba(255,255,255,.44);
  }

  .block{ margin-bottom:14px; }

  .block-label{
    margin:0 0 8px;
    font-size:11px;
    letter-spacing:.2em;
    color:rgba(255,255,255,.44);
  }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .chip{
    padding:6px 13px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:999px;
    background:rgba(255,255,255,.04);
    color:rgba(255,255,255,.84);
    font-family:inherit;
    font-size:12px;
    letter-spacing:.1em;
    text-indent:.1em;
    cursor:pointer;
    transition:background .25s ease, border-color .25s ease, color .25s ease;
  }
  .chip:hover{ background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.34); }
  .chip.on{
    background:rgba(255,255,255,.90);
    border-color:transparent;
    color:#1c1c1c;
  }

  /* 导入字体专用：右侧留出删除位 */
  .chip{ position:relative; }
  .chip.has-x{ padding-right:27px; }
  .chip-x{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    width:15px;
    height:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(0,0,0,.22);
    font-size:12px;
    line-height:1;
    text-indent:0;
    opacity:.55;
  }
  .chip-x:hover{ opacity:1; }
  .chip.on .chip-x{ background:rgba(0,0,0,.16); }

  .colors{ display:flex; flex-direction:column; gap:9px; }
  .color-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12px;
    letter-spacing:.1em;
    color:rgba(255,255,255,.84);
    cursor:pointer;
  }
  .color-row input[type="color"]{
    width:48px;
    height:26px;
    padding:0;
    border:1px solid rgba(255,255,255,.18);
    border-radius:8px;
    background:transparent;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
  }
  .color-row input[type="color"]::-webkit-color-swatch-wrapper{ padding:2px; }
  .color-row input[type="color"]::-webkit-color-swatch{ border:0; border-radius:6px; }

  .txt-in{
    width:124px;
    padding:5px 8px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:8px;
    background:rgba(255,255,255,.06);
    color:rgba(255,255,255,.90);
    font-family:inherit;
    font-size:12px;
    letter-spacing:.04em;
    text-align:center;
    outline:none;
    -webkit-appearance:none;
    appearance:none;
    transition:border-color .25s ease;
  }
  .txt-in::placeholder{ color:rgba(255,255,255,.32); }
  .txt-in:focus{ border-color:rgba(255,255,255,.42); }

  /* 开关 */
  .sw{
    width:38px;
    height:22px;
    margin:0;
    border-radius:999px;
    background:rgba(255,255,255,.14);
    position:relative;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
    transition:background .25s ease;
  }
  .sw::after{
    content:"";
    position:absolute;
    top:2px; left:2px;
    width:18px; height:18px;
    border-radius:50%;
    background:#fff;
    transition:transform .25s ease;
  }
  .sw:checked{ background:rgba(255,255,255,.85); }
  .sw:checked::after{ transform:translateX(16px); }

  /* 透明度滑杆 */
  .range-row{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:11px;
    font-size:12px;
    letter-spacing:.1em;
    color:rgba(255,255,255,.84);
  }
  .range-row input[type="range"]{
    flex:1;
    min-width:0;
    height:3px;
    margin:0;
    border-radius:999px;
    background:rgba(255,255,255,.20);
    -webkit-appearance:none;
    appearance:none;
    outline:none;
  }
  .range-row input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:15px; height:15px;
    border-radius:50%;
    background:#fff;
    cursor:pointer;
  }
  .range-row b{
    width:38px;
    text-align:right;
    font-weight:400;
    color:rgba(255,255,255,.62);
  }

  .note{
    margin:0;
    min-height:14px;
    font-size:11px;
    letter-spacing:.12em;
    color:rgba(255,255,255,.60);
    opacity:0;
    transition:opacity .3s ease;
  }
  .note.on{ opacity:1; }

  /* ---------- 密码错误抖动 ---------- */
  .pod.shake{ animation:shake .45s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0);    }
    20%    { transform:translateX(-7px); }
    40%    { transform:translateX(6px);  }
    60%    { transform:translateX(-4px); }
    80%    { transform:translateX(2px);  }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

  <div class="bg" id="bg"></div>

  <div class="pod" id="pod">

    <div class="lens">
      <h1 class="title">霞与昼</h1>
    </div>

    <div class="mid">
      <div class="enter-box">
        <span class="enter" id="enter">进入小世界</span>
      </div>
    </div>

    <div class="form" id="form">
      <input class="slot" id="slot" type="password" inputmode="numeric"
             autocomplete="off" maxlength="6" placeholder="请输入 6 位密码">
      <button class="confirm" id="confirm" type="button">确认</button>
    </div>

    <p class="hint" id="hint">6 位密码 · 输入后点确认</p>

  </div>

  <button class="reset" id="reset" type="button" hidden>重设密码记忆</button>

  <!-- 封面设置：仅本页可用，进入 app.html 后即无法更改 -->
  <button class="dot" id="dot" type="button" aria-label="封面设置"><i></i></button>

  <div class="sheet" id="sheet" hidden>
    <p class="sheet-title">封面设置</p>

    <div class="block">
      <p class="block-label">背景</p>
      <div class="chips">
        <button class="chip" id="pick" type="button">选择图片</button>
        <button class="chip" id="clear" type="button">恢复默认</button>
      </div>
    </div>

    <div class="block">
      <p class="block-label">整体字体</p>
      <div class="chips" id="fonts"></div>
      <div class="chips" style="margin-top:9px">
        <button class="chip" id="font-import" type="button">＋ 选择字体文件</button>
        <button class="chip" id="font-link" type="button">🔗 粘贴字体链接</button>
      </div>
      <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2" hidden>
    </div>

    <div class="block">
      <p class="block-label">文字颜色</p>
      <div class="colors">
        <label class="color-row"><span>霞与昼</span><input type="color" id="col-title"></label>
        <label class="color-row"><span>进入小世界</span><input type="color" id="col-enter"></label>
      </div>
    </div>

    <div class="block">
      <p class="block-label">封面文字（想写什么就写什么）</p>
      <div class="colors">
        <label class="color-row"><span>标题</span>
          <input type="text" class="txt-in" id="txt-title" maxlength="14" placeholder="霞与昼"></label>
        <label class="color-row"><span>进入按钮</span>
          <input type="text" class="txt-in" id="txt-enter" maxlength="14" placeholder="进入小世界"></label>
      </div>
    </div>

    <div class="block">
      <p class="block-label">胶囊磨砂</p>
      <div class="colors">
        <label class="color-row"><span>磨砂颜色</span><input type="color" id="col-pod"></label>
        <label class="color-row"><span>跟随背景</span>
          <input type="checkbox" id="pod-auto" class="sw"></label>
      </div>
      <label class="range-row">
        <span>透明度</span>
        <input type="range" id="pod-alpha" min="0" max="300" step="5" value="100">
        <b id="pod-alpha-val">100%</b>
      </label>
    </div>

    <p class="note" id="note"></p>
    <input type="file" id="file" accept="image/*" hidden>
  </div>

<script>
  var PASSWORD = '114613';
  var TARGET   = 'app.html';

  var STORE_KEY = 'xia-yu-zhou.pass';
  var COVER_KEY = 'xia-yu-zhou.cover';
  var TTL       = 3 * 24 * 60 * 60 * 1000;   /* 3 天 */
  var AUTO_WAIT = 1200;                      /* 免密时的跳转延迟，留时间点「重设」 */
  var BG_MAX    = 1600;                      /* 背景图最长边，超出则等比压缩 */

  var FONTS = [
    { key:'default', name:'默认',
      stack:'"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif' },
    { key:'song', name:'宋体',
      stack:'"Songti SC","SimSun","Noto Serif SC",serif' },
    { key:'kai', name:'楷体',
      stack:'"Kaiti SC","KaiTi","STKaiti",serif' },
    { key:'yuan', name:'圆体',
      stack:'"Yuanti SC","YouYuan","Microsoft YaHei",sans-serif' },
    { key:'hei', name:'黑体',
      stack:'"Heiti SC","SimHei","Microsoft YaHei",sans-serif' },
    { key:'fang', name:'仿宋',
      stack:'"FangSong","STFangsong","FangSong_GB2312",serif' }
  ];

  var bg      = document.getElementById('bg');
  var pod     = document.getElementById('pod');
  var slot    = document.getElementById('slot');
  var confirm = document.getElementById('confirm');
  var hint    = document.getElementById('hint');
  var reset   = document.getElementById('reset');
  var enter   = document.getElementById('enter');

  var dot   = document.getElementById('dot');
  var sheet = document.getElementById('sheet');
  var pick  = document.getElementById('pick');
  var clear = document.getElementById('clear');
  var fonts = document.getElementById('fonts');
  var noteEl= document.getElementById('note');
  var file  = document.getElementById('file');
  var colTitle = document.getElementById('col-title');
  var colEnter = document.getElementById('col-enter');
  var txtTitle = document.getElementById('txt-title');
  var txtEnter = document.getElementById('txt-enter');
  var colPod   = document.getElementById('col-pod');
  var elPodAuto     = document.getElementById('pod-auto');
  var elPodAlpha    = document.getElementById('pod-alpha');
  var elPodAlphaVal = document.getElementById('pod-alpha-val');
  var titleEl  = document.querySelector('.title');
  var fontImport = document.getElementById('font-import');
  var fontFile   = document.getElementById('font-file');
  var fontLink   = document.getElementById('font-link');

  /* 页面写死的默认文案，作为输入框留空时的兜底 */
  var DEF_TITLE = titleEl ? titleEl.textContent : '霞与昼';
  var DEF_ENTER = enter ? enter.textContent : '进入小世界';

  var done      = false;
  var autoTimer = null;
  var failTimer = null;
  var hintTimer = null;
  var noteTimer = null;

  /* ================= 封面设置 ================= */
  var COVER = { font:'default', bg:'', titleColor:'#f6f6f6', enterColor:'#000000',
                titleText:'', enterText:'',                       /* '' = 用页面默认文案 */
                podColor:'#ffffff', podAlpha:1, podAuto:true,
                fontLinks:[] };   /* 从链接导入的字体：[{key,url}] */

  function loadCover () {
    try {
      var o = JSON.parse(localStorage.getItem(COVER_KEY) || 'null');
      if (o && typeof o === 'object') {
        if (typeof o.font === 'string') COVER.font = o.font;
        if (typeof o.bg   === 'string') COVER.bg   = o.bg;
        if (typeof o.titleColor === 'string') COVER.titleColor = o.titleColor;
        if (typeof o.enterColor === 'string') COVER.enterColor = o.enterColor;
        if (typeof o.titleText === 'string') COVER.titleText = o.titleText;
        if (typeof o.enterText === 'string') COVER.enterText = o.enterText;
        if (typeof o.podColor === 'string') COVER.podColor = o.podColor;
        if (typeof o.podAlpha === 'number') COVER.podAlpha = o.podAlpha;
        if (typeof o.podAuto  === 'boolean') COVER.podAuto = o.podAuto;
        if (Array.isArray(o.fontLinks)) COVER.fontLinks = o.fontLinks;
      }
    } catch (e) {}
  }

  function saveCover () {
    try { localStorage.setItem(COVER_KEY, JSON.stringify(COVER)); return true; }
    catch (e) { return false; }        /* 多半是图片太大超出配额 */
  }

  function stackOf (key) {
    for (var i = 0; i < FONTS.length; i++) if (FONTS[i].key === key) return FONTS[i].stack;
    for (var j = 0; j < USERFONTS.length; j++) if (USERFONTS[j].key === key) return USERFONTS[j].stack;
    return FONTS[0].stack;
  }

  function applyCover () {
    /* 字体 */
    document.documentElement.style.setProperty('--font', stackOf(COVER.font));

    /* 文字颜色 */
    document.documentElement.style.setProperty('--title-color', COVER.titleColor);
    document.documentElement.style.setProperty('--enter-color', COVER.enterColor);
    if (colTitle && colTitle.value !== COVER.titleColor) colTitle.value = COVER.titleColor;
    if (colEnter && colEnter.value !== COVER.enterColor) colEnter.value = COVER.enterColor;

    /* 封面文字（留空 = 用页面默认文案） */
    if (titleEl) titleEl.textContent = COVER.titleText || DEF_TITLE;
    if (enter)   enter.textContent   = COVER.enterText  || DEF_ENTER;
    if (txtTitle && txtTitle.value !== COVER.titleText) txtTitle.value = COVER.titleText;
    if (txtEnter && txtEnter.value !== COVER.enterText) txtEnter.value = COVER.enterText;

    /* 胶囊磨砂：颜色 + 透明度 */
    applyPodAlpha(COVER.podAlpha);
    applyPodTint();
    if (colPod && colPod.value !== COVER.podColor) colPod.value = COVER.podColor;
    if (elPodAuto) elPodAuto.checked = !!COVER.podAuto;
    var pct = Math.round(COVER.podAlpha * 100);
    if (elPodAlpha)    elPodAlpha.value = String(pct);
    if (elPodAlphaVal) elPodAlphaVal.textContent = pct + '%';

    /* 背景 */
    if (COVER.bg) {
      bg.style.backgroundImage = 'url("' + COVER.bg + '")';
      bg.classList.add('has-image');
    } else {
      bg.style.backgroundImage = '';   /* 回落到 CSS 里的默认柔光 */
      bg.classList.remove('has-image');
    }

    /* 选中态 */
    var kids = fonts.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].classList.toggle('on', kids[i].getAttribute('data-key') === COVER.font);
    }
    clear.classList.toggle('on', !COVER.bg);
  }

  /* 用户导入的字体（存在 IndexedDB；localStorage 装不下几 MB 的字体文件） */
  var USERFONTS = [];

  function renderFonts () {
    if (!fonts) return;
    fonts.innerHTML = '';
    FONTS.concat(USERFONTS).forEach(function (f) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (f.user ? ' has-x' : '');
      b.textContent = f.name;
      b.setAttribute('data-key', f.key);
      b.style.fontFamily = f.stack;          /* 直接用该字体显示，所见即所得 */
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        COVER.font = f.key;
        applyCover();
        saveCover();
      });
      if (f.user) {
        var x = document.createElement('span');
        x.className = 'chip-x';
        x.textContent = '×';
        x.title = '删除这个字体';
        x.addEventListener('click', function (e) {
          e.stopPropagation();
          removeUserFont(f.key);
        });
        b.appendChild(x);
      }
      fonts.appendChild(b);
    });
    applyCover();                            /* 同步选中态 */
  }

  function note (msg) {
    noteEl.textContent = msg;
    noteEl.classList.add('on');
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () {
      noteEl.classList.remove('on');
      noteEl.textContent = '';
    }, 2800);
  }

  /* 等比压缩，避免超出 localStorage 配额；data: 图片不会污染 canvas */
  function shrink (dataUrl, cb) {
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h) { cb(dataUrl); return; }
      var s = Math.min(1, BG_MAX / Math.max(w, h));
      w = Math.max(1, Math.round(w * s));
      h = Math.max(1, Math.round(h * s));
      try {
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(c.toDataURL('image/jpeg', 0.82));
      } catch (e) {
        cb(dataUrl);              /* 压缩失败就退回原图 */
      }
    };
    img.onerror = function () { cb(null); };
    img.src = dataUrl;
  }

  pick.addEventListener('click', function (e) {
    e.stopPropagation();
    file.click();
  });

  clear.addEventListener('click', function (e) {
    e.stopPropagation();
    COVER.bg = '';
    applyCover();
    saveCover();
    note('已恢复默认背景');
  });

  /* 文字颜色：拖动时实时预览，松手才写入存储（避免每次都写大图 base64） */
  function bindColor (el, key) {
    if (!el) return;
    el.addEventListener('input', function (e) {
      e.stopPropagation();
      COVER[key] = el.value;
      applyCover();
    });
    el.addEventListener('change', function () { saveCover(); });
    el.addEventListener('click', function (e) { e.stopPropagation(); });
  }
  bindColor(colTitle, 'titleColor');
  bindColor(colEnter, 'enterColor');

  /* 改封面文字：边打字边预览，失焦才写入存储 */
  function bindText (el, key) {
    if (!el) return;
    el.addEventListener('click', function (e) { e.stopPropagation(); });
    el.addEventListener('input', function () {
      COVER[key] = el.value.trim();
      applyCover();
    });
    el.addEventListener('change', function () { saveCover(); });
  }
  bindText(txtTitle, 'titleText');
  bindText(txtEnter, 'enterText');

  /* 磨砂颜色 */
  if (colPod) {
    colPod.addEventListener('click', function (e) { e.stopPropagation(); });
    colPod.addEventListener('input', function (e) {
      e.stopPropagation();
      COVER.podColor = colPod.value;
      COVER.podAuto = false;              /* 手动选色即退出跟随 */
      applyCover();
    });
    colPod.addEventListener('change', function () { saveCover(); });
  }

  /* 跟随背景 */
  if (elPodAuto) {
    elPodAuto.addEventListener('click', function (e) { e.stopPropagation(); });
    elPodAuto.addEventListener('change', function () {
      COVER.podAuto = elPodAuto.checked;
      applyCover();
      saveCover();
      note(COVER.podAuto ? '磨砂色跟随背景' : '磨砂色改为手动');
    });
  }

  /* 透明度滑杆 */
  if (elPodAlpha) {
    elPodAlpha.addEventListener('click', function (e) { e.stopPropagation(); });
    elPodAlpha.addEventListener('input', function (e) {
      e.stopPropagation();
      COVER.podAlpha = Number(elPodAlpha.value) / 100;
      applyPodAlpha(COVER.podAlpha);
      if (elPodAlphaVal) elPodAlphaVal.textContent = elPodAlpha.value + '%';
    });
    elPodAlpha.addEventListener('change', function () { saveCover(); });
  }

  /* 透明度：三档渐变的不透明度 + 模糊半径都随倍率走。
     调到 0 时模糊一起归零，胶囊就变成一块完全通透的玻璃，背景原样可见。 */
  function applyPodAlpha (a) {
    var s = document.documentElement.style;
    s.setProperty('--pod-alpha', String(a));
    s.setProperty('--pod-a1', String(.10  * a));
    s.setProperty('--pod-a2', String(.045 * a));
    s.setProperty('--pod-a3', String(.085 * a));
    s.setProperty('--pod-blur', (14 * a).toFixed(1) + 'px');
    s.setProperty('--pod-sat',  (1 + .12 * a).toFixed(3));
    s.setProperty('--pod-ring', (.14 * a).toFixed(3));
    s.setProperty('--pod-hl',   (.20 * a).toFixed(3));
    s.setProperty('--pod-hl2',  (.06 * a).toFixed(3));
    s.setProperty('--pod-hlr',  (.28 * a).toFixed(3));
    s.setProperty('--pod-hlr2', (.08 * a).toFixed(3));
  }

  /* ---------- 磨砂色计算 ---------- */
  function setTint (rgb) {
    document.documentElement.style.setProperty('--pod-tint', rgb.join(' '));
  }
  function hexToRgb (h) {
    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(h || ''));
    return m ? [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)] : [255,255,255];
  }
  function lightenToward (rgb, k) {   /* k = 向白色混多少 */
    return rgb.map(function (v) { return Math.round(v + (255 - v) * k); });
  }
  function avgColor (dataUrl, cb) {   /* 取背景图平均色（缩到 1×1 像素） */
    var img = new Image();
    img.onload = function () {
      try {
        var c = document.createElement('canvas');
        c.width = 1; c.height = 1;
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, 1, 1);
        var d = ctx.getImageData(0, 0, 1, 1).data;
        cb([d[0], d[1], d[2]]);
      } catch (e) { cb(null); }
    };
    img.onerror = function () { cb(null); };
    img.src = dataUrl;
  }
  /* 自动模式：取背景均色后向白色提亮七成 —— 保留背景色调，同时维持磨砂的透亮感 */
  function applyPodTint () {
    if (!COVER.podAuto) { setTint(hexToRgb(COVER.podColor)); return; }
    if (COVER.bg) {
      avgColor(COVER.bg, function (rgb) {
        setTint(lightenToward(rgb || hexToRgb(COVER.podColor), 0.72));
      });
    } else {
      setTint(lightenToward(hexToRgb(getComputedStyle(document.documentElement)
              .getPropertyValue('--bg').trim() || '#292929'), 0.72));
    }
  }

  file.addEventListener('change', function () {
    var f = file.files && file.files[0];
    file.value = '';
    if (!f) return;
    if (f.type && f.type.indexOf('image/') !== 0) { note('请选择图片文件'); return; }

    var fr = new FileReader();
    fr.onload = function () {
      shrink(fr.result, function (out) {
        if (!out) { note('图片读取失败'); return; }
        COVER.bg = out;
        applyCover();
        if (!saveCover()) note('已应用，但图片过大未能保存');
        else              note('背景已更新');
      });
    };
    fr.onerror = function () { note('图片读取失败'); };
    fr.readAsDataURL(f);
  });

  /* 面板开合 */
  dot.addEventListener('click', function (e) {
    e.stopPropagation();
    sheet.hidden = !sheet.hidden;
  });

  document.addEventListener('click', function (e) {
    if (sheet.hidden) return;
    if (sheet.contains(e.target) || dot.contains(e.target)) return;
    sheet.hidden = true;
  });

  /* ================= 密码 / 免密 ================= */
  function rememberOn () {
    try { localStorage.setItem(STORE_KEY, String(Date.now() + TTL)); } catch (e) {}
  }
  function rememberFresh () {
    try {
      var until = parseInt(localStorage.getItem(STORE_KEY), 10);
      if (!until || isNaN(until)) return false;
      if (Date.now() > until) { localStorage.removeItem(STORE_KEY); return false; }
      return true;
    } catch (e) { return false; }
  }
  function rememberOff () {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  }

  pod.addEventListener('click', function () {
    if (done) return;
    slot.focus();                   /* 轻触胶囊任意处 → 聚焦密码框 */
  });

  /* 点「进入小世界」才跳转（不再自动跳，留时间用右下角封面设置） */
  enter.addEventListener('click', function (e) {
    if (!done) return;              /* 未解锁时交给胶囊处理 */
    e.stopPropagation();
    go();
  });

  slot.addEventListener('input', function () {
    slot.value = slot.value.replace(/\D/g, '').slice(0, PASSWORD.length);
  });

  slot.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    submit();
  });

  confirm.addEventListener('click', function (e) {
    e.stopPropagation();
    submit();
  });

  reset.addEventListener('click', function (e) {
    e.stopPropagation();
    clearTimeout(autoTimer);
    rememberOff();

    done = false;
    pod.classList.remove('ready');
    slot.disabled = false;
    slot.value = '';
    reset.hidden = true;
    setHint('6 位密码 · 输入后点确认', false);
    slot.focus();
  });

  function submit () {
    if (done) return;

    var v = slot.value;
    if (!v) {
      setHint('请先输入密码', true);
      slot.focus();
      return;
    }
    if (v !== PASSWORD) { fail(); return; }

    /* 正确 → 记 3 天 → 立刻进入 */
    done = true;
    rememberOn();
    clearTimeout(failTimer);
    clearTimeout(hintTimer);
    pod.classList.remove('shake');
    pod.classList.add('ready');
    slot.blur();
    slot.disabled = true;
    setHint('正在链接中', false);
    go();
  }

  /* 3 天内免密：直接显示为已解锁，但**不自动跳转**——
     改为点「进入小世界」才走，否则来不及用右下角的封面设置。 */
  function showUnlocked () {
    done = true;
    pod.classList.add('ready');
    slot.disabled = true;
    reset.hidden = !rememberFresh();
    setHint('正在链接中', false);
  }

  function fail () {
    if (done) return;
    pod.classList.remove('shake');
    void pod.offsetWidth;           /* 重排以重放动画 */
    pod.classList.add('shake');
    setHint('密码不对，再试一次', true);

    clearTimeout(failTimer);
    failTimer = setTimeout(function () {
      pod.classList.remove('shake');
      slot.value = '';
      slot.focus();
    }, 480);
  }

  function setHint (text, warn) {
    hint.textContent = text;
    hint.classList.toggle('warn', !!warn);
    clearTimeout(hintTimer);
    if (warn) {
      hintTimer = setTimeout(function () {
        hint.classList.remove('warn');
        hint.textContent = done ? '正在链接中' : '6 位密码 · 输入后点确认';
      }, 1800);
    }
  }

  function go () {
    window.location.href = TARGET;
  }

  /* ================= 导入字体（IndexedDB 存储） ================= */
  var FDB_NAME = 'xy-cover-fonts';

  function fdb () {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(FDB_NAME, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('f'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror   = function () { rej(r.error); };
    });
  }
  function fdbAll () {
    return fdb().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction('f', 'readonly');
        var s = t.objectStore('f');
        var kq = s.getAllKeys(), vq = s.getAll();
        t.oncomplete = function () { res({ keys: kq.result || [], vals: vq.result || [] }); };
        t.onerror = function () { rej(t.error); };
      });
    });
  }
  function fdbPut (k, v) {
    return fdb().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction('f', 'readwrite');
        t.objectStore('f').put(v, k);
        t.oncomplete = res;
        t.onerror = function () { rej(t.error); };
      });
    });
  }
  function fdbDel (k) {
    return fdb().then(function (db) {
      return new Promise(function (res) {
        var t = db.transaction('f', 'readwrite');
        t.objectStore('f').delete(k);
        t.oncomplete = res;
        t.onerror = res;
      });
    });
  }

  /* 把字体二进制注册成浏览器可用的字体族 */
  function registerFont (key, buf) {
    if (!window.FontFace) return Promise.reject(new Error('no FontFace'));
    var family = 'uf-' + key;
    var ff = new FontFace(family, buf);
    return ff.load().then(function (f) { document.fonts.add(f); return family; });
  }

  function loadUserFonts () {
    return fdbAll().then(function (d) {
      var jobs = d.keys.map(function (k, i) {
        var rec = d.vals[i];
        if (!rec || !rec.buf) return Promise.resolve();
        return registerFont(k, rec.buf).then(function (family) {
          USERFONTS.push({
            key: k, user: true,
            name: rec.name || '导入',
            family: family,
            stack: '"' + family + '", sans-serif'
          });
        }).catch(function () {});
      });
      return Promise.all(jobs).then(function () {
        /* 恢复从链接导入的字体 */
        var links = COVER.fontLinks || [];
        return Promise.all(links.map(function (x) {
          return registerUrlFont(x.url).catch(function () {});
        }));
      });
    }).then(renderFonts, renderFonts);
  }

  function removeUserFont (key) {
    fdbDel(key).then(function () {
      USERFONTS = USERFONTS.filter(function (f) { return f.key !== key; });
      if (COVER.font === key) { COVER.font = 'default'; saveCover(); }
      renderFonts();
      note('字体已删除');
    });
  }

  if (fontImport) {
    fontImport.addEventListener('click', function (e) {
      e.stopPropagation();
      fontFile.click();
    });
  }

  /* 从链接导入：粘贴字体文件直链（.ttf/.otf/.woff/.woff2）即可，不用先下载到手机 */
  function registerUrlFont (url) {
    var base = url.split('/').pop().split('?')[0].replace(/\.[^.]+$/, '');
    var name = (base || '链接字体').slice(0, 8);
    var key  = 'l' + String(url).replace(/[^0-9a-zA-Z]/g, '').slice(-24);
    var family = 'uf-' + key;
    return new FontFace(family, 'url("' + url + '")').load().then(function (f) {
      document.fonts.add(f);
      USERFONTS = USERFONTS.filter(function (x) { return x.key !== key; });
      USERFONTS.push({ key: key, user: true, name: name, family: family,
                       stack: '"' + family + '", sans-serif', url: url });
      return key;
    });
  }

  if (fontLink) {
    fontLink.addEventListener('click', function (e) {
      e.stopPropagation();
      var url = prompt('粘贴字体文件直链（.ttf / .otf / .woff / .woff2）：\n\n' +
                       '· 需要是「直接指向字体文件」的链接\n' +
                       '· 页面链接（如 fonts.google.com 的介绍页）不行');
      if (!url) return;
      url = url.trim();
      if (!/^https?:\/\//i.test(url)) { note('链接要以 http:// 或 https:// 开头'); return; }
      registerUrlFont(url).then(function (key) {
        renderFonts();
        COVER.font = key;
        applyCover();
        COVER.fontLinks = (COVER.fontLinks || []).filter(function (x) { return x.key !== key; });
        COVER.fontLinks.push({ key: key, url: url });
        saveCover();
        note('链接字体已导入');
      }).catch(function () {
        note('导入失败：链接可能不是字体文件，或对方不允许跨域');
      });
    });
  }
  if (fontFile) {
    fontFile.addEventListener('change', function () {
      var f = fontFile.files && fontFile.files[0];
      fontFile.value = '';
      if (!f) return;
      if (f.size > 30 * 1024 * 1024) { note('字体文件过大（超过 30MB）'); return; }

      var key  = 'u' + (f.name + '_' + f.size).replace(/[^0-9a-zA-Z]/g, '').slice(-24);
      var name = f.name.replace(/\.[^.]+$/, '').slice(0, 6);
      var fr = new FileReader();
      fr.onload = function () {
        var buf = fr.result;
        registerFont(key, buf)
          .then(function () { return fdbPut(key, { buf: buf, name: name }); })
          .then(loadUserFonts)
          .then(function () {
            COVER.font = key;
            applyCover();
            saveCover();
            note('字体「' + name + '」已导入');
          })
          .catch(function () { note('导入失败：这个字体文件可能不被支持'); });
      };
      fr.onerror = function () { note('文件读取失败'); };
      fr.readAsArrayBuffer(f);
    });
  }

  /* ================= 启动 ================= */
  loadCover();
  applyCover();
  loadUserFonts();          /* 异步恢复已导入的字体，完成后会重绘选项 */
  if (rememberFresh()) showUnlocked();
</script>

</body>
</html>
